name: Build TH095 host binary

on:
  push:
    paths:
      - "th095/**"
      - ".github/workflows/th095-*.yml"
  pull_request:
    paths:
      - "th095/**"
  workflow_dispatch:

# The Switch NRO job will be added here once the switch_runtime.cpp backend
# lands (see th095/README.md, "Status").

jobs:
  # Host smoke build: compiles the pinned upstream reconstruction plus the
  # port platform layer for x86-64 Linux. Validates that the port layer
  # keeps up with the pinned upstream commit.
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 pkg-config \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libgl1-mesa-dev \
            libfontconfig1-dev

      - name: Fetch upstream reconstruction
        run: python3 th095/scripts/fetch_upstream.py

      - name: Apply port source patches
        run: python3 th095/scripts/patch_upstream.py build-inputs/th095-src

      - name: Configure and build (host)
        run: |
          set +e
          cmake -S th095 -B th095/build-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTH095_UPSTREAM_SRC="$GITHUB_WORKSPACE/build-inputs/th095-src" \
            2>&1 | tee /tmp/ci-cfg.log
          cfg_status=${PIPESTATUS[0]}
          cmake --build th095/build-host -j"$(nproc)" 2>&1 | tee /tmp/ci-build.log
          build_status=${PIPESTATUS[0]}
          if [ "$cfg_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            {
              echo "### Tools"
              cmake --version | head -1; ninja --version; gcc --version | head -1
              echo; echo "### pkg-config module checks"
              pkg-config --exists SDL2 && echo "SDL2: OK" || echo "SDL2: MISSING"
              pkg-config --exists SDL2_ttf && echo "SDL2_ttf: OK" || echo "SDL2_ttf: MISSING"
              pkg-config --exists SDL2_image && echo "SDL2_image: OK" || echo "SDL2_image: MISSING"
              echo; echo "### /usr/lib/x86_64-linux-gnu/pkgconfig (sdl/gl entries)"
              ls /usr/lib/x86_64-linux-gnu/pkgconfig/ 2>/dev/null | grep -iE 'sdl|gl' || echo "(none / dir missing)"
              echo; echo "### configure log (last 60 lines)"
              tail -60 /tmp/ci-cfg.log
              echo; echo "### build log (last 40 lines)"
              tail -40 /tmp/ci-build.log
              echo; echo "### CMakeFiles/CMakeError.log (last 40 lines)"
              tail -40 th095/build-host/CMakeFiles/CMakeError.log 2>/dev/null || true
            } > /tmp/ci-diag.txt
            echo "----- TH095 CI DIAGNOSTICS -----"
            cat /tmp/ci-diag.txt
            python3 -c 'import json,sys; print(json.dumps({"title": "[th095-ci-diag] run " + sys.argv[1], "body": "Auto-posted TH095 CI diagnostics (configure/build failure). Safe to close once the build is green."}))' "$GITHUB_RUN_ID" > /tmp/issue-payload.json
            issue_json=$(curl -sS -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" -d @/tmp/issue-payload.json)
            issue_number=$(printf '%s' "$issue_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("number",""))' 2>/dev/null || true)
            if [ -n "$issue_number" ]; then
              python3 -c 'import json; diag=open("/tmp/ci-diag.txt").read(); print(json.dumps({"body": "Full diagnostics:\n\n```\n" + diag + "\n```"}))' > /tmp/comment-payload.json
              curl -sS -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$issue_number/comments" -d @/tmp/comment-payload.json -o /dev/null || true
              echo "Diagnostics posted to issue #$issue_number"
            fi
            exit 1
          fi

      - name: Upload host binary (smoke artifact)
        uses: actions/upload-artifact@v4
        with:
          name: th095-host
          path: th095/build-host/th095-host

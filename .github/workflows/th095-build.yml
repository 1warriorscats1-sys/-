name: Build TH095 host binary

on:
  push:
    paths:
      - "th095/**"
      - ".github/workflows/th095-*.yml"
  pull_request:
    paths:
      - "th095/**"
  workflow_dispatch:


jobs:
  # Host smoke build: compiles the pinned upstream reconstruction plus the
  # port platform layer for x86-64 Linux. Validates that the port layer
  # keeps up with the pinned upstream commit.
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 pkg-config \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libgl1-mesa-dev \
            libfontconfig1-dev

      - name: Fetch upstream reconstruction
        run: python3 th095/scripts/fetch_upstream.py

      - name: Apply port source patches
        run: python3 th095/scripts/patch_upstream.py build-inputs/th095-src

      - name: Configure and build (host)
        run: |
          set +e
          trap 'echo "::error file=.github/workflows/th095-build.yml::[diag] shell error near line $LINENO running: $BASH_COMMAND"' ERR
          cmake -S th095 -B th095/build-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTH095_UPSTREAM_SRC="$GITHUB_WORKSPACE/build-inputs/th095-src" \
            2>&1 | tee /tmp/ci-cfg.log
          cfg_status=${PIPESTATUS[0]}
          cmake --build th095/build-host -j"$(nproc)" 2>&1 | tee /tmp/ci-build.log
          build_status=${PIPESTATUS[0]}
          if [ "$cfg_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            {
              echo "### configure log (last 50 lines)"
              tail -50 /tmp/ci-cfg.log
              echo; echo "### build log (last 20 lines)"
              tail -20 /tmp/ci-build.log
              echo; echo "### pkg-config module checks"
              pkg-config --exists SDL2 && echo "SDL2: OK" || echo "SDL2: MISSING"
              pkg-config --exists SDL2_ttf && echo "SDL2_ttf: OK" || echo "SDL2_ttf: MISSING"
              pkg-config --exists SDL2_image && echo "SDL2_image: OK" || echo "SDL2_image: MISSING"
              echo; echo "### tools"
              cmake --version | head -1; ninja --version; gcc --version | head -1
              echo; echo "### /usr/lib/x86_64-linux-gnu/pkgconfig (sdl/gl entries)"
              ls /usr/lib/x86_64-linux-gnu/pkgconfig/ 2>/dev/null | grep -iE 'sdl|gl' || echo "(none / dir missing)"
              echo; echo "### CMakeFiles/CMakeError.log (last 30 lines)"
              tail -30 th095/build-host/CMakeFiles/CMakeError.log 2>/dev/null || true
            } > /tmp/ci-diag.txt 2>&1
            echo "----- TH095 CI DIAGNOSTICS -----"
            cat /tmp/ci-diag.txt
            # Channel A: check-run annotations (readable via API)
            python3 -c 't=open("/tmp/ci-diag.txt").read(); [print("::error file=th095/CMakeLists.txt::" + c.replace(chr(10), " \\n ")) for c in [t[i:i+900] for i in range(0, len(t), 900)][:8]]'
            # Channel B: GitHub issue (best effort)
            python3 -c 'import json,sys; print(json.dumps({"title": "[th095-ci-diag] run " + sys.argv[1], "body": "Auto-posted TH095 CI diagnostics (configure/build failure). Safe to close once the build is green."}))' "$GITHUB_RUN_ID" > /tmp/issue-payload.json
            issue_json=$(curl -sS -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" -d @/tmp/issue-payload.json || echo "CURL_FAILED")
            issue_number=$(printf '%s' "$issue_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("number",""))' 2>/dev/null || true)
            if [ -n "$issue_number" ]; then
              python3 -c 'import json; diag=open("/tmp/ci-diag.txt").read(); print(json.dumps({"body": "Full diagnostics:\n\n```\n" + diag + "\n```"}))' > /tmp/comment-payload.json
              curl -sS -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$issue_number/comments" -d @/tmp/comment-payload.json -o /dev/null || true
              echo "Diagnostics posted to issue #$issue_number"
            else
              echo "issue post failed: $(printf '%s' "$issue_json" | head -c 300)"
            fi
            # Channel C: push diagnostics to the ci-diag branch (best effort)
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            mkdir -p .ci-diag
            cp /tmp/ci-diag.txt ".ci-diag/run-$GITHUB_RUN_ID.txt"
            git add .ci-diag
            git commit -q -m "ci: diagnostics for run $GITHUB_RUN_ID" || true
            git push -q -f origin "HEAD:refs/heads/ci-diag" || echo "ci-diag push failed"
            exit 1
          fi

      - name: Upload host binary (smoke artifact)
        uses: actions/upload-artifact@v4
        with:
          name: th095-host
          path: th095/build-host/th095-host

  # Nintendo Switch NRO build: the pinned upstream + port layer compiled
  # with the devkitA64 toolchain inside the official devkitpro/devkita64
  # image (prebuilt toolchain + static portlibs; no toolchain build needed).
  # CMake branch: th095/CMakeLists.txt (NINTENDO_SWITCH), backend sources
  # in th095/port/ (switch_compat.cpp, gles_ffp.cpp, switch_runtime.cpp).
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull devkitPro Switch toolchain image
        run: docker pull devkitpro/devkita64:latest

      - name: Build TH095 Switch NRO
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -e GITHUB_WORKSPACE=/work \
            devkitpro/devkita64:latest \
            bash /work/th095/scripts/ci_switch_build.sh
          status=$?
          [ "$status" -eq 0 ]

      - name: Upload Switch NRO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: th095-switch
          path: th095/build-switch/th095.nro

      - name: Upload Switch ELF (with debug symbols, for crash analysis)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: th095-elf
          path: th095/build-switch/th095

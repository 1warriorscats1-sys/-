# Wonderful Waking World (thWWW) experimental open NRO.
# Builds only open-source engine code; no game data is fetched.
name: thWWW experimental open NRO

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a08187-repo
    paths:
      - .github/workflows/thwww-switch.yml
      - wonderful-waking-world/**
      - scripts/build_thwww.py
      - scripts/apply_www_overlay.py
      - scripts/create_www_icon.py
      - scripts/verify_www_nro.py
      - scripts/test_thwww_native.py
      - tests/test_thwww.py
      - tests/native/www_save.c

permissions:
  contents: read

jobs:
  host-tests:
    name: thWWW host checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install icon/NRO test dependency
        run: sudo apt-get update && sudo apt-get install -y python3-pil

      - name: Integration and icon tests
        run: python3 -m unittest tests.test_thwww -v

      - name: Native save and frame-policy tests (with sanitizers)
        run: python3 scripts/test_thwww_native.py --sanitize

      - name: Build engine with the thWWW integration (headless)
        run: python3 scripts/build_thwww.py --target headless

  switch:
    name: Build thWWW NRO
    needs: host-tests
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkita64:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pil git cmake make

      - name: Build thWWW NRO and source archive
        run: python3 scripts/build_thwww.py --target switch

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: thWWW-experimental-switch
          if-no-files-found: error
          path: |
            dist/thwww/switch/thWWW-experimental-switch.zip
            dist/thwww/switch/thwww-source.tar.gz
            dist/thwww/switch/BUILD.json
            dist/thwww/switch/thwww-symbols.zip

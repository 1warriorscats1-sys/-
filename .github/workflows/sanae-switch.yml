# SANAE broad audit: full-engine ASan/UBSan/LSan gate and cleanup/UB repairs.
name: SANAE experimental open NRO

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a080a0-repo
      - arena/01a081f7-repo
    paths:
      - .github/workflows/sanae-switch.yml
      - open-runner/**
      - scripts/**
      - tests/**

permissions:
  contents: read

jobs:
  host-tests:
    name: Проверки SANAE на Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cover-conversion test dependency
        run: sudo apt-get update && sudo apt-get install -y python3-pil

      - name: Публичные тесты и проверки сохранений
        run: SANAE_SANITIZE=1 python3 -m unittest discover -s tests -v

      - name: Сборка и тестирование интеграции SANAE
        run: python3 scripts/build_sanae.py --target headless
      - name: Native combat, draw-order and sanitized audio regressions
        run: python3 scripts/test_sanae_runner.py --sanitize-audio


      - name: Full-engine ASan, UBSan and leak regressions
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S .cache/sanae-source-headless -B .cache/sanae-build-sanitized \
            -DBACKEND=noop -DAUDIO_BACKEND=none -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_ASAN=ON -DCMAKE_C_FLAGS=-fsanitize=undefined \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=undefined -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build .cache/sanae-build-sanitized --parallel 4
          python3 scripts/test_sanae_runner.py --build .cache/sanae-build-sanitized --sanitize-audio

  switch:
    name: Сборка SANAE NRO
    needs: host-tests
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkita64:latest

    steps:
      - uses: actions/checkout@v4

      - name: Установка инструментов сборки
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pil git cmake make

      - name: Сборка SANAE NRO и архива исходников
        run: python3 scripts/build_sanae.py --target switch

      - name: Загрузка результата
        uses: actions/upload-artifact@v4
        with:
          name: SANAE-experimental-switch
          if-no-files-found: error
          path: |
            dist/sanae/switch/SANAE-experimental-switch.zip
            dist/sanae/switch/sanae-source.tar.gz
            dist/sanae/switch/BUILD.json
            dist/sanae/switch/sanae-symbols.zip

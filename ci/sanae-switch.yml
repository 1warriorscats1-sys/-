# Install as .github/workflows/sanae-switch.yml when workflow writes are allowed.
# Manual only: avoids consuming Actions quota on every source push.
name: SANAE experimental open NRO
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Public tests, including native failure injection
        run: SANAE_SANITIZE=1 python3 -m unittest discover -s tests -v
      - name: Build and test SANAE integration without private game files
        run: python3 scripts/build_sanae.py --target headless
  switch:
    needs: host-tests
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build orchestration tools
        run: apt-get update && apt-get install -y --no-install-recommends python3 git cmake make
      - name: Build SANAE NRO and exact corresponding source
        run: python3 scripts/build_sanae.py --target switch
      - uses: actions/upload-artifact@v4
        with:
          name: SANAE-experimental-switch
          if-no-files-found: error
          path: |
            dist/sanae/switch/SANAE-experimental-switch.zip
            dist/sanae/switch/sanae-source.tar.gz
            dist/sanae/switch/BUILD.json
